<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">

    <script src="./chamados.js" defer></script>
    <script src="./app-chamados.js" defer></script>

    <title>Sistema de Chamados</title>
</head>
<body>

    <h1>Sistema de Chamados</h1>

    <form>

        <input type="text" id="pesquisa" placeholder="Pesquisar por nome">

        <button type="button" id="pesquisar">Pesquisar</button>

        <hr>

        <button type="button" id="todas">Todos</button>

        <button type="button" id="alta">Alta</button>

        <button type="button" id="media">Média</button>

        <button type="button" id="baixa">Baixa</button>

        <button type="button" id="critica">Crítica</button>

        <hr>

        <button type="button" id="aberto">Aberto</button>

        <button type="button" id="progresso">Em progresso</button>

        <button type="button" id="fechado">Fechado</button>

        <hr>

<select id="prioridade-status">
    <option value="">Selecione a prioridade</option>
    <option value="Alta">Alta</option>
    <option value="Média">Média</option>
    <option value="Baixa">Baixa</option>
    <option value="Crítica">Crítica</option>
</select>

<select id="status-prioridade">
    <option value="">Selecione o status</option>
    <option value="Aberto">Aberto</option>
    <option value="Em progresso">Em progresso</option>
    <option value="Fechado">Fechado</option>
</select>

<button type="button" id="filtrar">Filtrar</button>

    </form>

    <hr>

    <div class="chamados-container" id="chamados-container"></div>

</body>

</html>
